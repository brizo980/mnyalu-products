<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MNYALU</title>
    <link rel="stylesheet" href="style.css">



</head>
<body class="login-page-bg">

    <div class="login-standalone-container" style="max-width: 480px; padding: 60px 50px;">
        <div id="reset-form-content">
            <img src="assets/mnyalu logo.jpeg" alt="Logo" class="login-logo" style="width: 220px;">
            
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Reset Password</h2>
            <p style="margin-bottom: 30px; color: #666;">Enter your Gmail address to receive a recovery link</p>
            
            <div class="input-group" style="margin-bottom: 25px;">
                <span class="lock-icon" style="font-size: 1.2rem;">📧</span>
                <input type="email" id="reset-email" placeholder="example@gmail.com" required 
                       style="width: 100%; padding: 15px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #ccc;">
            </div>
            
            <button class="login-submit-btn" onclick="sendResetEmail()" 
                    style="width: 100%; padding: 15px; font-size: 1.1rem; background: #f5f5f5; border: 1px solid #ccc; font-weight: bold; cursor: pointer;">
                Send Reset Link
            </button>
        </div>

        <div id="sent-confirmation" style="display: none; text-align: center;">
            <div style="font-size: 4rem; color: #28a745; margin-bottom: 20px;">✅</div>
            <h2 style="font-size: 2rem; margin-bottom: 10px; color: #28a745;">Sent!</h2>
            <p style="color: #666; margin-bottom: 30px;">
                A recovery link has been sent to <br>
                <strong id="display-email" style="color: #333;"></strong>
            </p>
            <p style="font-size: 0.9rem; color: #888;">Check your Gmail inbox or spam folder.</p>
        </div>
        
        <div class="back-link" style="margin-top: 25px;">
            <a href="login.html" style="text-decoration: none; color: #666; font-size: 1rem;">&larr; Back to Login</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
